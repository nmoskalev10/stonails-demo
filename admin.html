<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — stonails</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Экран входа -->
<div class="login" id="login">
  <form class="login-card" id="login-form">
    <h1>Вход в админку</h1>
    <p class="login-hint" id="login-hint">Введите почту и пароль, которые вам выдали</p>

    <label>Почта
      <input type="email" id="login-email" autocomplete="username" required>
    </label>
    <label>Пароль
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>

    <p class="error" id="login-error" hidden></p>
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
</div>

<!-- Рабочий экран -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <span class="topbar-brand">stonails · админка</span>
    <div class="topbar-actions">
      <span class="status" id="status"></span>
      <a class="btn btn-ghost" href="index.html" target="_blank" rel="noopener">Открыть сайт</a>
      <button class="btn btn-primary" id="save" type="button">Сохранить</button>
      <button class="btn btn-ghost" id="logout" type="button">Выйти</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" data-panel="general" type="button">Главное</button>
    <button class="tab" data-panel="about" type="button">Обо мне</button>
    <button class="tab" data-panel="courses" type="button">Курсы</button>
    <button class="tab" data-panel="cases" type="button">Работы и отзывы</button>
    <button class="tab" data-panel="history" type="button">История</button>
  </nav>

  <main class="panel" id="panel"></main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
